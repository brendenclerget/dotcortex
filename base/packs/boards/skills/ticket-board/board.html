<meta charset="utf-8">
<title>Team Ticket Board</title>
<style>
/* Layout: whose-move list on the left (lanes), the selected ticket's card on the right; one column on phones.
   Neutral slate/amber tokens; --accent marks structure, --attn marks what's on you. */
:root{
  --bg:#f5f6f8;--surface:#ffffff;--surface-2:#eceef2;--ink:#1a1e24;--ink-2:#3b424c;--muted:#5d6672;
  --line:#dce0e6;--line-strong:#c1c7d0;
  --accent:#243246;--accent-ink:#2d5a8e;--accent-soft:#e5edf7;--on-accent:#f3f6fa;--accent-muted:#c3cfdf;
  --attn:#f1d36b;--attn-ink:#3a2e00;--attn-soft:#faf2d3;--attn-line:#a8850f;
  --good:#256b3a;--good-soft:#e0efe4;--warn:#8a5300;--warn-soft:#fbeed2;--bad:#a3352a;--bad-soft:#f8e1dd;--info:#2a5b91;--info-soft:#e1eaf6;
  --focus:#2d5a8e;--shadow:0 1px 2px rgb(26 30 36 / .06),0 6px 20px rgb(26 30 36 / .06);
  --body:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;--display:var(--body);
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;--tools-h:61px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
  --bg:#111418;--surface:#1a1e24;--surface-2:#242931;--ink:#edf0f3;--ink-2:#cdd3da;--muted:#98a2ad;--line:#2e343c;--line-strong:#434b55;
  --accent:#18212e;--accent-ink:#9dc1ea;--accent-soft:#1e2a3a;--on-accent:#edf2f8;--accent-muted:#a7b6ca;
  --attn:#f1d36b;--attn-ink:#2a2100;--attn-soft:#383018;--attn-line:#f1d36b;
  --good:#8fd3a0;--good-soft:#1b3022;--warn:#f0c46a;--warn-soft:#3a2f16;--bad:#f19a8c;--bad-soft:#3d221e;--info:#9cc3f0;--info-soft:#1c2a3b;
  --focus:#f1d36b;--shadow:none}}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#111418;--surface:#1a1e24;--surface-2:#242931;--ink:#edf0f3;--ink-2:#cdd3da;--muted:#98a2ad;--line:#2e343c;--line-strong:#434b55;
  --accent:#18212e;--accent-ink:#9dc1ea;--accent-soft:#1e2a3a;--on-accent:#edf2f8;--accent-muted:#a7b6ca;
  --attn:#f1d36b;--attn-ink:#2a2100;--attn-soft:#383018;--attn-line:#f1d36b;
  --good:#8fd3a0;--good-soft:#1b3022;--warn:#f0c46a;--warn-soft:#3a2f16;--bad:#f19a8c;--bad-soft:#3d221e;--info:#9cc3f0;--info-soft:#1c2a3b;
  --focus:#f1d36b;--shadow:none}
/* One colour, icon and word per ticket state (never colour alone). --sl: stripe, --sb/--sf: badge. */
.s-needs{--sl:var(--attn-line);--sb:var(--attn);--sf:var(--attn-ink)}
.s-ready{--sl:var(--good);--sb:var(--good-soft);--sf:var(--good)}
.s-covered{--sl:var(--attn-line);--sb:var(--attn-soft);--sf:var(--attn-ink)}
:root[data-theme="dark"] .s-covered{--sf:var(--attn)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .s-covered{--sf:var(--attn)}}
.s-progress{--sl:var(--info);--sb:var(--info-soft);--sf:var(--info)}
.s-work{--sl:var(--warn);--sb:var(--warn-soft);--sf:var(--warn)}
.s-blocked{--sl:var(--bad);--sb:var(--bad-soft);--sf:var(--bad)}
.s-planning{--sl:var(--accent-ink);--sb:var(--accent-soft);--sf:var(--accent-ink)}
.s-notstarted{--sl:var(--muted);--sb:var(--surface-2);--sf:var(--ink-2)}
.s-parked{--sl:var(--line-strong);--sb:var(--surface-2);--sf:var(--ink-2)}
.s-done{--sl:var(--line-strong);--sb:transparent;--sf:var(--muted)}
.s-done .sbadge,.sbadge.s-done{box-shadow:inset 0 0 0 1px var(--line-strong)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--body);margin:0}
.word{font:800 24px/1 var(--display);letter-spacing:-.02em}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
a{color:var(--accent-ink)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
code{font:13px/1.4 var(--mono);background:var(--surface-2);padding:1px 5px;border-radius:4px;overflow-wrap:anywhere}

/* Header */
.band{background:var(--accent);color:var(--on-accent)}
.band .in{display:flex;align-items:center;gap:12px 20px;flex-wrap:wrap;padding:10px 20px;min-height:60px}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand span{font-size:15px;color:var(--accent-muted)}
.sumline{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:14px;color:var(--accent-muted)}
.sumline b{color:var(--on-accent);font:800 16px/1 var(--display);margin-right:4px}
.sumline a{color:var(--accent-muted)}
.conn{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--accent-muted)}
.conn::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--attn)}
.conn.off::before{background:transparent;border:2px solid var(--accent-muted)}
.tools{position:sticky;top:0;z-index:6;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.tools .in{display:flex;gap:8px;align-items:center;padding:8px 20px;flex-wrap:wrap}
.field{min-height:44px;border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:0 12px;font-size:16px}
#filter{flex:0 1 300px;min-width:0;font-weight:600;cursor:pointer}
#q{flex:1 1 200px;min-width:0}
.pending{display:none;align-items:center;gap:10px;background:var(--attn);color:var(--attn-ink);border-radius:8px;padding:0 0 0 12px;font-size:14px;font-weight:600;min-height:44px}
.pending.show{display:flex}
.pending code{background:color-mix(in srgb,var(--attn-ink) 12%,transparent);color:var(--attn-ink)}
.btn{min-height:44px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);border-radius:8px;padding:0 14px;font-size:14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:8px;justify-content:center;text-decoration:none}
.btn:hover{border-color:var(--accent-ink)}
.btn.small{font-size:13px;padding:0 12px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.go{background:var(--good);border-color:var(--good);color:var(--surface)}
:root[data-theme="dark"] .btn.primary{background:var(--attn);color:var(--attn-ink);border-color:var(--attn)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.primary{background:var(--attn);color:var(--attn-ink);border-color:var(--attn)}}
.pending .btn{background:var(--attn-ink);color:var(--attn);border-color:var(--attn-ink)}
.linkbtn{background:none;border:0;padding:0 4px;min-height:44px;color:var(--accent-ink);font-weight:600;font-size:14px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

/* Layout */
.layout{display:grid;grid-template-columns:460px minmax(0,1fr);max-width:1480px;margin:0 auto;align-items:start}
.queue{position:sticky;top:var(--tools-h);max-height:calc(100vh - var(--tools-h));overflow:auto;border-right:1px solid var(--line);padding:0 16px 80px 20px;overscroll-behavior:contain}
.pane{padding:20px 28px 96px;min-width:0}
/* State chips: counts per state, one tap to filter */
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:12px 0 6px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 10px;border-radius:999px;border:1.5px solid var(--line-strong);background:var(--surface);font-size:13px;font-weight:600;color:var(--ink-2);cursor:pointer}
.chip b{font:800 14px/1 var(--display);color:var(--ink)}
.chip svg.i{width:15px;height:15px;color:var(--sf)}
.chip[aria-pressed="true"]{background:var(--sb,var(--accent-soft));border-color:var(--sl,var(--accent-ink));color:var(--sf,var(--accent-ink))}
.chip[aria-pressed="true"] b{color:inherit}
.chip.zero{opacity:.6}
.group{margin:0 0 10px}
/* Actor lanes: whose move it is. Yours is open; Agent queue, Waiting and Done start collapsed to a count. */
.al{margin:0 0 12px}
.al-h{position:sticky;top:0;z-index:4;background:var(--bg);display:flex;align-items:center;gap:4px 10px;flex-wrap:wrap;padding:12px 2px 10px;border-bottom:2px solid var(--line-strong)}
.al-h h2{display:flex;align-items:center;gap:8px;font:800 19px/1.2 var(--display);margin:0}
.al-h h2 .gi{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:8px;background:var(--surface-2);color:var(--ink-2)}
.al-yours .al-h h2 .gi{background:var(--attn);color:var(--attn-ink)}
.al-h .cnt{font:800 19px/1 var(--display);color:var(--ink)}
.al-h .sum{flex-basis:100%;font-size:14px;color:var(--muted);min-width:0;overflow-wrap:anywhere}
.al-h .sum b{color:var(--ink-2);font-weight:600}
.al-h .gtools{margin-left:auto}
.al-note{font-size:14px;color:var(--muted);margin:8px 2px 10px}
.al-sub{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;font-weight:700;color:var(--ink-2);text-transform:uppercase;letter-spacing:.05em;margin:14px 2px 8px}
.al-sub .n{color:var(--muted);font-weight:600}
.al-sub .gtools{margin-left:auto;text-transform:none;letter-spacing:0}
.fam{border-left:2px solid var(--line-strong);margin:0 0 10px 4px;padding-left:10px}
.fam-h{display:flex;align-items:baseline;gap:4px 8px;flex-wrap:wrap;width:100%;background:none;border:0;padding:4px 2px 6px;min-height:36px;text-align:left;cursor:pointer;color:var(--ink-2);font-size:14px}
.fam-h:hover .fam-t{text-decoration:underline}
.fam-h .fam-t{font-weight:600;min-width:0;overflow-wrap:anywhere}
.fam-h .fam-n{color:var(--muted);font-size:13px;white-space:nowrap}
.bystate{font-size:13px;color:var(--muted);font-weight:600;margin-right:2px}
.jump{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:12px 0 2px}
.jump .linkbtn{min-height:36px;font-size:13px;color:var(--muted);margin-left:auto}
.batchfold{width:100%;justify-content:flex-start;margin:0 0 8px}
.al-sub+.linkbtn{min-height:32px;font-size:13px;margin:-4px 0 4px}
.act.decide{background:var(--surface);border-color:var(--line-strong)}
.act .btnrow.even .btn{flex:1 1 180px}
.act ul.left{margin:0;padding-left:20px}
.group-h{position:sticky;top:0;z-index:3;background:var(--bg);display:flex;align-items:center;gap:6px 10px;flex-wrap:wrap;padding:10px 2px 8px;border-bottom:1px solid var(--line);margin-bottom:8px}
.group-h h2{display:flex;align-items:center;gap:8px;font:800 16px/1.2 var(--display);margin:0;color:var(--sf)}
.group-h h2 .gi{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:7px;background:var(--sb);color:var(--sf)}
.group-h h2 .gi svg.i{width:16px;height:16px}
.group-h .n{font-size:14px;color:var(--muted);font-weight:600}
.group-h .gtools{margin-left:auto;display:flex;gap:6px;align-items:center}
.group-note{font-size:14px;color:var(--muted);margin:0 2px 10px}
.confirm{border:1.5px solid var(--good);background:var(--good-soft);border-radius:10px;padding:12px 14px;margin:0 0 10px;display:grid;gap:10px}
.confirm p{margin:0;font-size:15px}
.confirm .btnrow{display:flex;gap:8px;flex-wrap:wrap}
.row{scroll-margin-top:72px;display:flex;align-items:stretch;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--sl);border-radius:10px;margin-bottom:8px;position:relative}
.row.sel{border-color:var(--accent-ink);border-left-color:var(--sl);box-shadow:0 0 0 1px var(--accent-ink),var(--shadow)}
.row.dim{opacity:.72}
.pick{display:flex;align-items:flex-start;justify-content:center;width:44px;min-height:44px;flex:none;padding-top:14px;cursor:pointer}
.pick input{width:20px;height:20px;margin:0;accent-color:var(--good);cursor:pointer}
.row-main{flex:1;min-width:0;text-align:left;background:none;border:0;padding:10px 14px 12px 12px;cursor:pointer;display:grid;gap:5px;border-radius:0 10px 10px 0;min-height:44px}
.row .pick+.row-main{padding-left:0}
.r-top{display:flex;align-items:center;gap:4px 10px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.r-title{font-weight:600;font-size:15.5px;line-height:1.4;overflow-wrap:anywhere;text-wrap:pretty}
.r-state{display:flex;align-items:center;gap:6px 8px;flex-wrap:wrap;font-size:13.5px}
.r-why{color:var(--ink-2)}
.r-ac{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font:600 13px var(--mono);color:var(--ink-2);white-space:nowrap}
.mini{display:inline-flex;gap:1px;width:44px;height:6px}
.mini i{flex:1;background:var(--line-strong);border-radius:1px}.mini i.on{background:var(--good)}
.id{font:600 13px var(--mono);color:var(--accent-ink)}
.sbadge{display:inline-flex;align-items:center;gap:5px;border-radius:6px;padding:2px 8px;font-size:13px;font-weight:700;background:var(--sb);color:var(--sf);line-height:1.45;white-space:nowrap}
.sbadge svg.i{width:14px;height:14px}
.sbadge.big{font-size:14px;padding:4px 10px}
.st{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:600;color:var(--ink-2)}
.tag{display:inline-flex;align-items:center;gap:4px;border-radius:5px;padding:1px 7px;font-size:13px;font-weight:600;background:var(--surface-2);color:var(--ink-2);line-height:1.5}
.tag svg.i{width:14px;height:14px}
.tag.att{background:var(--attn);color:var(--attn-ink)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.bad{background:var(--bad-soft);color:var(--bad)}
.tag.good{background:var(--good-soft);color:var(--good)}
.tag.acc{background:var(--accent-soft);color:var(--accent-ink)}
.undo{flex:none;align-self:center;margin-right:8px}
.empty{color:var(--muted);font-size:15px;margin:12px 2px}
.gtoggle{display:flex;align-items:center;gap:6px;background:none;border:0;min-height:44px;padding:0 4px;font-size:14px;font-weight:600;color:var(--accent-ink);cursor:pointer}
.gtoggle svg{transition:transform .15s}.gtoggle[aria-expanded="true"] svg{transform:rotate(90deg)}
.subh{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:14px 2px 8px}
.backbar{display:none}
.cardnav{display:flex;justify-content:flex-end;max-width:840px;margin:0 0 10px}
.cardnav:empty{display:none}

/* Card */
.card{background:var(--surface);border:1px solid var(--line);border-top:6px solid var(--sl);border-radius:12px;box-shadow:var(--shadow);padding:20px 24px 22px;display:grid;grid-template-columns:minmax(0,1fr);gap:22px;max-width:840px}
.c-state{display:flex;align-items:center;gap:8px 10px;flex-wrap:wrap}
.c-why{font-size:15px;color:var(--ink-2)}
.c-meta{display:flex;align-items:center;gap:4px 10px;flex-wrap:wrap;font-size:14px;color:var(--muted);margin-top:10px}
.c-title{font:800 26px/1.2 var(--display);letter-spacing:-.015em;margin:4px 0 8px;text-wrap:balance}
.c-count{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:16px}
.c-count strong{font-weight:700}
.c-count .rem{color:var(--warn);font-weight:700}
.c-count .ok{color:var(--good);font-weight:700}
.segs{display:flex;gap:2px;flex:0 1 220px;height:8px}
.segs i{flex:1;border-radius:2px;background:var(--line-strong)}
.segs i.on{background:var(--good)}
.bar{flex:0 1 220px;height:8px;border-radius:4px;background:var(--line-strong);overflow:hidden}
.bar i{display:block;height:100%;background:var(--good)}
.flags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.since{display:flex;gap:8px;align-items:flex-start;color:var(--muted);font-size:14px;margin-top:10px}
.since svg.i{width:16px;height:16px;margin-top:2px}
/* The one line saying what's expected of the viewer (every card and row). */
.expect{display:flex;gap:8px;align-items:flex-start;margin:12px 0 0;padding:10px 12px;border-radius:8px;background:var(--surface-2);font-size:15.5px;line-height:1.45}
.expect svg.i{margin-top:2px}
.expect.you{background:var(--attn-soft);border:1px solid color-mix(in srgb,var(--attn-ink) 22%,transparent)}
.expect b{font-weight:700}
.r-exp{flex-basis:100%;color:var(--muted);font-size:13.5px}
.r-exp.you{color:var(--ink);font-weight:600}
.holds{margin-top:10px;display:grid;gap:6px}
.holds{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:12px}
.holds h4{margin:4px 0 0;font-size:14px;font-weight:600;color:var(--ink-2);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.holds ul{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.holds li{display:flex;gap:4px 8px;align-items:baseline;flex-wrap:wrap;font-size:15px;min-width:0}
.holds li .ht{min-width:0;overflow-wrap:anywhere}
.holds .linkbtn{min-height:0;padding:0}
.lane{display:inline-flex;border-radius:5px;padding:0 7px;font-size:12.5px;font-weight:700;line-height:1.6;white-space:nowrap}
.lane.now{background:var(--attn);color:var(--attn-ink)}
.lane.later,.lane.deferred{background:var(--surface-2);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line-strong)}
.history{font-size:14px;color:var(--muted)}
.history>summary{cursor:pointer;display:flex;gap:6px;align-items:flex-start;list-style:none;min-height:32px}
.history>summary>span{min-width:0;overflow-wrap:anywhere}
.history>summary::-webkit-details-marker{display:none}
.history>summary svg{transition:transform .15s;margin-top:3px}
.history[open]>summary svg{transform:rotate(90deg)}
.history blockquote{margin:6px 0 0;padding:6px 10px;border-left:3px solid var(--line-strong);color:var(--ink-2);white-space:pre-wrap;overflow-wrap:anywhere}
.sec{display:grid;gap:10px}
.sec,.asks,.askc,.act,.family,.more-body,.confirm{grid-template-columns:minmax(0,1fr)}
.shipped li,.evi li,.log li{overflow-wrap:anywhere;min-width:0}
.sec>h3{font:800 18px/1.25 var(--display);margin:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sec>h3 .sub{font:500 14px var(--body);color:var(--muted)}
.src{font-size:13px;color:var(--muted)}
.ref{display:block;font-size:13px;color:var(--muted);margin-top:2px;overflow-wrap:anywhere}
.none{color:var(--muted);font-style:italic;margin:0}
.checklist{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.checklist li{display:grid;grid-template-columns:24px 1fr;gap:4px 10px;align-items:start;padding:7px 8px;border-radius:6px}
.checklist li.open{background:var(--warn-soft)}
.checklist li.cov{background:var(--surface-2)}
.checklist li.cov .mark{border:2px dashed var(--muted);color:var(--muted)}
.checklist li.cov .word-s{color:var(--ink-2)}
.c-count .cov{color:var(--ink-2);font-weight:700}
.checklist li.done .t{color:var(--ink-2)}
.checklist .mark{display:flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;margin-top:1px}
.checklist li.done .mark{background:var(--good);color:var(--surface)}
.checklist li.open .mark{border:2px solid var(--warn);color:var(--warn)}
.checklist .mark svg.i{width:14px;height:14px;stroke-width:3}
.checklist .cid{font:600 13px var(--mono);color:var(--muted);white-space:nowrap;margin-right:4px}
.checklist .word-s{display:block;font-size:13px;font-weight:600;color:var(--good)}
.checklist li.open .word-s{color:var(--warn)}
.checklist .t{overflow-wrap:anywhere}
.grp-label{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:6px 0 0}
.family{display:grid;gap:6px}
.kidrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-left:4px solid var(--sl);border-radius:8px;background:var(--surface);text-align:left;cursor:pointer;min-height:44px}
.kidrow:hover{border-color:var(--accent-ink)}
.kidrow .kt{font-size:15px;min-width:0;overflow-wrap:anywhere}

<script>
(() => {
  "use strict";
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const icon = (n, label) => `<svg class="i" ${label ? `role="img" aria-label="${esc(label)}"` : 'aria-hidden="true"'}><use href="#i-${n}"/></svg>`;
  const inline = s => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/(^|[\s(])(https?:\/\/[^\s)<]+)/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>')
    .replace(/(^|\s)_([^_][\s\S]*?)_(?=\s|$|[.,;])/g, '$1<span class="ref">$2</span>');
  const plural = (n, one, many) => `${n} ${n === 1 ? one : (many || one + "s")}`;
  const fmtDate = iso => { const d = new Date(iso); return isNaN(d) ? String(iso || "").slice(0, 10) : d.toLocaleDateString([], { month: "short", day: "numeric" }); };
  const short = (s, n = 70) => { s = String(s || "").trim().replace(/\s+/g, " "); return s.length > n ? s.slice(0, n - 1) + "…" : s; };

  // Calls (decisions/<ID>). The page writes close (Close all, or Close on one card), iterate ("Not right…") and
  // reopen. keep and split are older values, still read, shown and undoable.
  const ACTIONS = {
    close: { label: "Close" },
    iterate: { label: "Not right", needs: "note" },
    split: { label: "Split", needs: "subtasks" },
    keep: { label: "Keep open" },
    reopen: { label: "Reopen", needs: "note" },
  };
  const STATUS = { REVIEW: "In review", IN_PROGRESS: "In progress", PLANNING: "Planning", BLOCKED: "Blocked", TODO: "To do", DONE: "Done" };
  const PRIO = { CRITICAL: "Critical", HIGH: "High", MEDIUM: "Medium", LOW: "Low" };
  // One primary state per ticket. Order = the list's group order.
  const STATES = {
    needs: { label: "Needs you", icon: "ask", note: "Built work with questions for you. Answering is the review: pick what's built and nothing changes; pick anything else and it becomes follow-up work." },
    ready: { label: "Ready to close", icon: "ready", note: "Every criterion checked, children done, nothing left to answer. Untick any you want to keep open, then close the rest together." },
    covered: { label: "Close or keep?", icon: "flag", note: "Closure proposed. What's unmet here is tracked by another ticket. Close it, or keep it open until that ticket closes." },
    progress: { label: "In progress", icon: "progress", note: "An agent is on it right now: its worktree exists, or its agent branch has a commit from the last 24 hours. Nothing needed from you unless a card says so." },
    notstarted: { label: "Not started", icon: "todo", note: "Queued work nobody has started. Nothing needed from you." },
    blocked: { label: "Blocked", icon: "block", note: "Waiting on you now (a decision in the decision board's Now lane) or on another ticket. Each card names what it waits on." },
    parked: { label: "Parked", icon: "pause", note: "Built and otherwise ready to close, but it waits on decisions you've set aside (Later or Deferred on the decision board). Nothing to do until you pick them up." },
    work: { label: "Work left", icon: "work", note: "An agent has more to do before it can close: unchecked criteria, open children, or changes you asked for. Each card says whether anything is on you." },
    planning: { label: "Planning", icon: "plan", note: "Scoped, not started. What gets built is chosen on the decision board." },
    done: { label: "Done", icon: "done", note: "Closed recently." },
  };
  const ORDER = ["needs", "ready", "covered", "blocked", "work", "progress", "notstarted", "parked", "planning", "done"];
  // Whose move it is. Every open ticket sits in one lane; a parent with open children has no lane of its own: it's
  // the header over its children, and a row only when there's something for a person.
  const LANES = {
    yours: { label: "Yours", icon: "you", note: "Everything that needs a tap or an answer from you: questions for you, and close-or-keep calls on tickets assigned to you. Nothing here changes or closes on silence." },
    agent: { label: "Agent queue", icon: "work", note: "Unchecked criteria nobody is on, in TODO.md order. The orchestrator works through it; nothing needed from you. “In progress” means an agent is on it right now (its worktree exists, or its agent branch has a commit from the last 24 hours)." },
    waiting: { label: "Waiting", icon: "pause", note: "Held by a teammate's answer, a decision, another ticket, or something set aside. Each row names what it waits on." },
    done: { label: "Done", icon: "done", note: "" },
  };
  const LANE_ORDER = ["yours", "agent", "waiting", "done"];
  const SUBS = {
    yours: [["ask", "Answer questions"], ["covered", "Decide whether to close"], ["ready", "Review ready to close"], ["undo", "Undo a Close"], ["closing", "Closing · awaiting apply"]],
    agent: [["active", "In progress · an agent is on it"], ["queue", "Up next"]],
    waiting: [["teammate", "On a teammate"], ["decision", "On a decision"], ["ticket", "On another ticket"], ["parked", "Set aside"]],
    done: [["done", ""]],
  };
  const LONG = 10;

  let data = null, byId = {}, filter = "lanes", query = "", selected = null, db = null, dbState = "connecting";
  // Identity: the signed-in viewer (user capability), whose view this is, and whether the db refuses their writes.
  const ID = { me: null, uid: null };
  let viewer = "", readOnly = false, project = "";
  const decisions = {}, applied = {}, seen = {}, moreOpen = {}, showAll = {}, nrOpen = {};
  const answers = {}, answersApplied = {};            // needs/<TICKET>:<N>, needs-applied/<TICKET>:<N>
  const store = { get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
                  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
  const local = store.get("dotcortex-ticket-board", {});        // calls mirror
  const localAns = store.get("dotcortex-ticket-board-needs", {}); // ask answers mirror
  const localSeen = store.get("dotcortex-ticket-board-seen", {});
  const ui = store.get("dotcortex-ticket-board-ui", {});
  const keepOpen = new Set(Array.isArray(ui.keepOpen) ? ui.keepOpen : []); // unticked in the closure batch (this browser)
  let doneOpen = !!ui.doneOpen, confirming = false, userPicked = false;
  const laneOpen = Object.assign({ agent: false, waiting: false, done: false, ready: false }, ui.laneOpen || {});
  filter = "lanes";
  if (ui.filter && /^(lanes|bystate|state:\w+|calls|changed|issues)$/.test(ui.filter)) filter = ui.filter;
  if (typeof ui.project === "string") project = ui.project;
  const VKEY = "dotcortex-ticket-board-viewer";
  const saveUi = () => store.set("dotcortex-ticket-board-ui", { filter, selected, keepOpen: [...keepOpen], doneOpen, laneOpen, project });

  // ---------- write keys ----------
  // One save loop serves two kinds of doc: a ticket call ("web.APP-054" -> decisions/web.APP-054) and an answer to one
  // ask ("web.APP-054:3" -> needs/web.APP-054:3). Ticket keys never contain ":".
  const isAskKey = k => String(k).includes(":");
  const ticketOf = k => String(k).split(":")[0];
  const memOf = k => isAskKey(k) ? answers : decisions;
  const locOf = k => isAskKey(k) ? localAns : local;
  const saveLoc = k => isAskKey(k) ? store.set("dotcortex-ticket-board-needs", localAns) : store.set("dotcortex-ticket-board", local);
  const pathOf = k => (isAskKey(k) ? "needs/" : "decisions/") + k;
  const recOf = k => memOf(k)[k] || locOf(k)[k] || null;

  // ---------- call state ----------
  const decisionOf = id => decisions[id] || local[id] || null;
  const valid = d => { if (!d || !d.action || !ACTIONS[d.action]) return false; const n = ACTIONS[d.action].needs;
    return n === "note" ? !!(d.note || "").trim() : n === "subtasks" ? !!(d.subtasks || []).length : true; };
  const isApplied = id => { const d = decisionOf(id), a = applied[id]; return !!(a && d && d.action && a.decidedAt && d.updatedAt && a.decidedAt >= d.updatedAt); };
  const ack = {}; // id -> updatedAt the db has acknowledged (our write, or its snapshot)
  function callState(id) {
    const d = decisionOf(id);
    if (!d || !d.action) return null;
    if (isApplied(id)) return "applied";
    if (!valid(d)) return "draft";
    if (!db || readOnly) return "local";
    return ack[id] === d.updatedAt ? "saved" : "saving";
  }
  const isPending = id => { const s = callState(id); return s === "saved" || s === "saving"; };
  const liveCall = id => { const s = callState(id); return s && s !== "applied" && s !== "draft" ? decisionOf(id).action : null; };
  // A draft: a "Not right…" (or older call) started but not complete; the db holds action: null, draft: <choice>.
  const draftOf = id => { const d = decisionOf(id); return d && !valid(d) ? (d.action || d.draft || null) : null; };

  // ---------- ask answers ----------
  const DEFAULT_OPTS = {
    Approve: [{ key: "approve", text: "Approve as written" }, { key: "change", text: "Change it: say how in the note", note: true }],
    Review: [{ key: "ok", text: "Looks right" }, { key: "change", text: "Needs changes: say what in the note", note: true }],
  };
  const askKey = (t, a) => `${t.id}:${a.n}`;
  const askOf = k => { const t = byId[ticketOf(k)]; return t ? (t.asks || []).find(a => `${t.id}:${a.n}` === k) : null; };
  const decOf = a => (a && a.decision && data.decisions && data.decisions[a.decision]) || null;
  const recommendedIn = o => /\(recommended/i.test(`${o.label || ""} ${o.detail || ""}`);

  function optionsOf(a) {

  const validAns = (k, r) => { const a = askOf(k); return !!(r && r.choice && a && (!noteNeeded(a, r.choice) || (r.note || "").trim())); };

  const answeredK = k => { const s = askState(k); return !!s && s !== "draft"; };
  const openAsks = t => (t.asks || []).filter(a => a.state === "open");
  const nowAsks = t => openAsks(t).filter(a => a.tier === "now");
  const toAnswer = t => nowAsks(t).filter(a => !answeredK(askKey(t, a)));
  // Decisions live on the decision board only. A ticket shows how many are open (decisions.yml, status open, naming
  // this ticket: the same count as the decision board's #ticket-<id>) and links there. Asks that cite a D-number, a
  // planning ticket's scoping asks and answers saved on them here earlier are never shown as questions.
  const decOpen = t => (open(t) && t.decisions_open) || [];
  const decHref = t => `${data.decision_board}#ticket-${t.id}`;
  const decPhrase = n => `${plural(n, "decision")} open`;
  // Each open decision's lane, as the decision board shows it: "now" needs its owner now; "later" (blocks: later)
  // and "deferred" (its owner said not now) are set aside and never make a ticket Blocked.
  const decInfo = id => (data.decisions && data.decisions[id]) || { id, title: "", lane: "now" };
  const laneOf = id => decInfo(id).lane || "now";
  const decNow = t => decOpen(t).filter(id => laneOf(id) === "now");
  const decAside = t => decOpen(t).filter(id => laneOf(id) !== "now");
  const decTitle = id => String(decInfo(id).title || "").replace(/\s*\((?:[A-Za-z0-9_-]+\.)?[A-Z][A-Z0-9]*-\d+[^)]*\)\s*$/, "");
  const decLink = id => `${data.decision_board}#${id}`;
  const LANE = { now: "Needs you now", later: "Set aside · Later", deferred: "Set aside · Deferred" };
  // D45, D46, D47, D50 -> [{label: "D45–D47", first: "D45"}, {label: "D50", first: "D50"}]
  function runs(ids) {
    const out = [];
    for (const id of ids) {
      const m = /^([A-Z]+)(\d+)$/.exec(id), last = out[out.length - 1];
      if (m && last && last.p === m[1] && +m[2] === last.n + 1) { last.n++; last.ids.push(id); continue; }
      out.push({ first: id, ids: [id], p: m ? m[1] : null, n: m ? +m[2] : NaN });
    }
    // a run of three or more reads as a range; two stay a pair ("D171, D172")
    return out.flatMap(r => r.ids.length >= 3 ? [{ label: `${r.first}–${r.ids[r.ids.length - 1]}`, first: r.first }] : r.ids.map(i => ({ label: i, first: i })));
  }
  const rangeTxt = ids => runs(ids).map(r => r.label).join(", ");
  const rangeHtml = ids => runs(ids).map(r => `<a href="${esc(decLink(r.first))}" target="_blank" rel="noopener">${esc(r.label)}</a>`).join(", ");
  const asideWord = ids => { const k = new Set(ids.map(laneOf)); return k.has("later") && k.has("deferred") ? "Later or Deferred" : k.has("deferred") ? "Deferred" : "Later"; };
  // The row's naming of decisions: titles for one or two, a range and the first title for more.
  const namedDecs = ids => ids.length <= 2 ? ids.map(id => `${id} ${short(decTitle(id), 48)}`.trim()).join(" · ")
    : `${rangeTxt(ids)} (${ids.length}): ${short(decTitle(ids[0]), 40)}, …`;
  const movedAsks = t => (t.asks || []).filter(a => a.decision);
  // An answer keeps what's built (no change) only when it picks the ask's built option; anything else is follow-up.
  const followUps = t => nowAsks(t).filter(a => { const k = askKey(t, a); return answeredK(k) && (!a.built_key || answerOf(k).choice !== a.built_key); });
  const pendingAsks = t => nowAsks(t).filter(a => { const s = askState(askKey(t, a)); return s === "saved" || s === "saving"; }).length;
  const openAnswerCount = t => nowAsks(t).filter(a => { const s = askState(askKey(t, a)); return s && s !== "applied"; }).length;

  // ---------- people: who "you" are, and whose move each item is ----------
  // The viewer is the assignee/owner whose value equals the signed-in person's email (or name), unless "Viewing as"
  // picked someone else (remembered in this browser). viewer "" = Everyone: Yours then holds every person's items.
  const same = (a, b) => !!a && !!b && String(a).trim().toLowerCase() === String(b).trim().toLowerCase();
  const isMe = v => !!(ID.me && v && (same(v, ID.me.email) || same(v, ID.me.name)));
  const mine = v => !viewer || same(v, viewer) || (isMe(viewer) && isMe(v));
  const shortWho = v => { v = String(v || ""); return v.includes("@") ? v.split("@")[0] : v; };
  const whoName = v => !v ? "whoever picks it up (no Assignee)" : viewer && mine(v) ? "you" : shortWho(v);
  const whoChip = v => v ? `<span class="who${isMe(v) ? " you" : ""}" title="${esc(v)}">${esc(shortWho(v))}${isMe(v) ? " (you)" : ""}</span>` : `<span class="who" title="No Assignee">unassigned</span>`;
  const askFor = (t, a) => a.for || t.assignee || "";
  const decOwner = id => decInfo(id).owner || "";
  const ownersTxt = ids => [...new Set(ids.map(decOwner))].map(whoName).join(", ") || "its owner";
  const decMine = ids => ids.filter(id => mine(decOwner(id)));

  // ---------- the ticket's state (build_board.py's state, refined by what's saved here) ----------
  const open = t => t.lane !== "closed";
  const acTxt = t => t.criteria_state === "unavailable" ? "No criteria" : `AC ${t.ac_done}/${t.ac_total}`;
  // Precedence: done > planning > needs (unanswered asks) > blocked > work ("not right", follow-up answers,
  // unchecked criteria, open children) > ready > in progress > not started. A saved Close counts only while the ticket
  // is still eligible; otherwise the ticket keeps its real state and the row flags the stale Close.
  // Eligible to close: build_board.py's close_eligible, or eligible apart from open children that are being closed
  // too (saved Close, or ticked in the batch); /ticket-board-apply closes children before their parent.
  const openKids = t => (t.children || []).map(c => byId[c]).filter(k => k && open(k));
  const eligible = t => !!(t.close_eligible || (t.close_eligible_own && openKids(t).every(k => (liveCall(k.id) === "close" || inBatch(k)) && eligible(k))));
  function stateOf(t) {
    const S = (key, why, extra) => ({ key, why, ...(extra || {}) });
    if (!open(t)) return S("done", t.state.why);
    const dnow = decNow(t), daside = decAside(t), aside = daside.length ? ` · ${rangeTxt(daside)} set aside` : "";
    if (t.status === "PLANNING") return S("planning", dnow.length ? `Waiting on ${ownersTxt(dnow)}: ${namedDecs(dnow)}${aside}`
      : daside.length ? `Parked until ${rangeTxt(daside)} ${daside.length === 1 ? "is" : "are"} picked up` : t.state_base.why, { dnow, daside });
    const base = t.state_base, call = liveCall(t.id), work = base.key === "progress" ? "progress" : "work";
    // covered: closure proposed and what's left is tracked by another ticket (build_board.py close_eligible_covered).
    const elig = eligible(t), cov = base.key === "covered", staleClose = call === "close" && !elig && !cov;
    const withKids = elig && !t.close_eligible ? ` · closes with ${openKids(t).map(k => k.id).join(", ")}` : "";
    // deps: blocked by another ticket or by the Status field; a BLOCKED ticket held only by decisions waits on them.
    const now = nowAsks(t), left = toAnswer(t), deps = base.key === "blocked" && !base.on_decision;
    const nothing = /nothing built/.test(base.why || "") ? " · nothing built" : "";
    const x = { dnow, daside, deps, noted: call === "iterate" };
    if (left.length) { const done = now.length - left.length;
      return S("needs", `${left.length} to answer${done ? ` · ${done} answered` : ""} · ${acTxt(t)}${deps ? ` · also ${base.why.replace(/ · (Own )?AC.*$/, "").toLowerCase()}` : dnow.length ? ` · then ${rangeTxt(dnow)} on the decision board` : ""}`, { ...x, left: left.length, staleClose }); }
    if (deps) return S("blocked", `${base.why}${dnow.length ? ` · and on ${ownersTxt(dnow)}: ${rangeTxt(dnow)}` : ""}`, { ...x, staleClose });
    // Blocked means waiting on a person now: a decision in the decision board's Now lane.
    if (dnow.length) return S("blocked", `Waiting on ${ownersTxt(dnow)}: ${namedDecs(dnow)}${nothing}${aside}`, { ...x, staleClose });
    if (call === "iterate") return S(work, `Not right: “${short(decisionOf(t.id).note, 60)}”${aside}`, { ...x, iterate: true });
    const fu = followUps(t);
    if (fu.length) return S(work, `Follow-up from the answer to ask ${fu.map(a => a.n).join(", ")} · ${acTxt(t)}${aside}`, { ...x, follow: fu, staleClose });
    // Otherwise ready, but decisions their owners set aside still name it: Parked, not Blocked and not Ready.
    if (elig && daside.length) return S("parked", `Parked until ${rangeTxt(daside)} ${daside.length === 1 ? "is" : "are"} picked up · ${acTxt(t)}`, { ...x, staleClose: call === "close" });
    if (elig) {
      if (call === "close") return S("ready", `${acTxt(t)} · closed here; archived on the next apply${withKids}`, { ...x, queued: true });
      const answered = now.length;
      return S("ready", (answered ? `${acTxt(t)} · ${plural(answered, "ask")} answered, no changes` : t.close_eligible ? base.why : `Own ${acTxt(t)} · closure proposed`) + withKids, { ...x, batch: true });
    }
    if (cov) {
      const by = (t.covered_by || []).join(", ");
      if (call === "close") return S("ready", `${acTxt(t)} · closed here; ${by} carr${t.covered_by.length === 1 ? "ies" : "y"} what's left; archived on the next apply`, { ...x, queued: true, covered: true });
      if (call === "keep") return S("blocked", `Kept open until ${by} close${t.covered_by.length === 1 ? "s" : ""} · ${acTxt(t)}`, { ...x, keptFor: t.covered_by });

  }
  // Is something on the viewer right now (an item in their Yours, or a Now decision they own)?
  const onYou = t => { const i = laneInfo(t); return !!(i && i.lane === "yours" && i.sub !== "closing") || (open(t) && decMine(decNow(t)).length > 0); };
  // The one line every card and row carries: what's expected of the viewer. {you, html} (html has links on cards).
  function expectOf(t, s, card) {
    const R = ids => card ? rangeHtml(ids) : esc(rangeTxt(ids));
    const T = id => card ? `<button class="linkbtn" style="min-height:0;padding:0" type="button" data-open="${esc(id)}">${esc(id)}</button>` : esc(id);
    const Y = h => ({ you: true, html: h }), N = h => ({ you: false, html: h });
    const dnow = s.dnow || [], daside = s.daside || [], dyou = decMine(dnow);
    const later = daside.length ? ` ${R(daside)} ${daside.length === 1 ? "is" : "are"} set aside (${asideWord(daside)}).` : "";
    const alsoNow = dyou.length ? ` Also answer ${R(dyou)} on the decision board.` : "";
    if (s.key === "done") return N(`Nothing to do: closed ${esc(t.completed || t.updated || "")}. Reopen… below if it isn't right.`);
    const li = laneInfo(t);
    if (li && li.sub === "teammate") { // someone else's move: say whose, and what they do
      const who = [...new Set(li.who)].map(whoName).join(", ");
      const what = { ask: `answer ${li.who.length === 1 ? "the question" : `${li.who.length} questions`}`, ready: "review and close it",
        covered: "close it or keep it open", undo: "check the Close on it", closing: "let apply close it" }[li.y] || "act on it";

    }
    const cov = ids => ids.map(T).join(" and ");
    if (s.keptFor) return N(`Nothing needed from you: kept open. Apply adds ${cov(s.keptFor)} as dependencies, and it's ready to close once ${s.keptFor.length === 1 ? "that closes" : "they close"}.${later}`);
    if (s.key === "covered") { const n = t.ac_covered || 0, by = t.covered_by || [];
      return Y(`Close it, or wait for ${cov(by)}: ${plural(n, "criterion", "criteria")} ${n === 1 ? "isn't" : "aren't"} met here, and ${by.length === 1 ? "that ticket tracks" : "those tickets track"} ${n === 1 ? "it" : "them"}.${later}`); }
    if (s.staleClose) return Y(`Undo the Close: it isn't ready (${esc(s.why.replace(/ · (Own )?AC.*$/, ""))}), or leave it and apply reports it.`);

      if (daside.length) return N(`Nothing to do; parked until ${R(daside)} ${daside.length === 1 ? "is" : "are"} picked up (${asideWord(daside)} on the decision board).`);

    if (s.key === "needs") { const n = toAnswer(t).filter(a => mine(askFor(t, a))).length;

    if (s.key === "ready") {
      if (s.queued) return N(card ? "Nothing needed from you: closed here; /ticket-board-apply archives it. Undo to change your mind." : "Nothing needed from you: closed here; archived on the next apply.");
      if (!card) return Y(inBatch(t) ? "Review and close (ticked in Close selected)." : "Review and close (unticked: stays open).");
      return Y(inBatch(t) ? "Review and close: it's ticked in Close selected, or use Close it below." : "Review and close: it's unticked, so it stays open until you close it.");
    }
    if (s.key === "parked") return N(`Nothing to do; parked until ${R(daside)} ${daside.length === 1 ? "is" : "are"} picked up (${asideWord(daside)} on the decision board). Then it's ready to close.`);
    if (s.key === "blocked" && !s.deps) {
      if (theirs) return N(`Nothing needed from you: ${theirs}${/nothing built/.test(s.why) ? "; nothing is built until then" : ""}.${later}`);
      return Y(`Answer ${R(dyou)} on the decision board${dyou.length > 1 ? ` (${dyou.length} decisions)` : ""}; if you already have, apply records it next. ${s.noted ? "An agent works on the “Not right” note meanwhile" : eligible(t) ? "Then it's ready to close" : /nothing built/.test(s.why) ? "Nothing is built until then" : "Then an agent can finish it"}.${later}`);
    }
    if (s.key === "blocked") {
      const deps = (t.depends_on || []).map(id => byId[id]).filter(k => k && open(k));
      if (!deps.length) return N(`Nothing needed from you: marked blocked${/: /.test(t.state_base.why) ? ` (${esc(t.state_base.why.replace(/^Blocked: /, "").replace(/ · (Own )?AC.*$/, ""))})` : ""}.${alsoNow}`);
      const depsYou = deps.filter(onYou);
      if (depsYou.length) return Y(`Start with ${depsYou.map(k => `${T(k.id)} (${esc(STATES[stateOf(k).key].label)})`).join(", ")}: this ticket waits on it.${alsoNow}`);
      const wait = deps.map(k => { const ks = stateOf(k); return `${T(k.id)} (${ks.queued ? "closed here; archived on apply" : esc(STATES[ks.key].label)})`; }).join(", ");
      return dyou.length ? Y(`Answer ${R(dyou)} on the decision board; otherwise it waits on ${wait}.`)
        : N(`Nothing needed from you: waiting on ${wait}.${later}`);
    }
    if (s.iterate) return N(`Nothing needed from you: waiting on an agent to act on the note (next /ticket-board-apply).${later}`);
    if (s.follow) return N(`Nothing needed from you: waiting on an agent to do the follow-up from the answer to ask ${s.follow.map(a => a.n).join(", ")}.${later}`);
    // Work left, In progress, Not started: say exactly what an agent still has to do, or which child needs the viewer.
    const kids = openKids(t), kidsYou = kids.filter(onYou), left = t.ac_total - t.ac_done;
    if (kidsYou.length) { // a child needs the viewer: say what, on which child
      const what = k => { const ks = stateOf(k);
        return ks.staleClose ? `undo the Close on ${T(k.id)}` : ks.key === "ready" ? `close ${T(k.id)}` : ks.key === "needs" ? `answer the questions on ${T(k.id)}`
          : ks.dnow && ks.dnow.length ? `answer ${R(decMine(ks.dnow))} on the decision board (for ${T(k.id)})` : `open ${T(k.id)}`; };
      const txt = kidsYou.map(what).join("; ");
      return Y(`${txt[0].toUpperCase()}${txt.slice(1)}. This ticket closes after its children${left && t.criteria_state !== "unavailable" ? `; an agent also has ${plural(left, "own criterion", "own criteria")} to finish` : ""}.${later}`);
    }
    const todo = [];
    if (s.key === "notstarted") return N(`Nothing needed from you: not started; ${t.todo_rank ? `queued at TODO #${t.todo_rank}` : "not queued in TODO.md yet"}.${later}`);
    if (t.needs.length) todo.push("write out its question");
    if (t.criteria_state === "unavailable") todo.push("add acceptance criteria");
    else if (left) todo.push(t.flags.some(f => f.code === "closure-unchecked") ? `check off ${plural(left, "open criterion", "open criteria")}` : `finish ${plural(left, "unchecked criterion", "unchecked criteria")}`);
    const kq = kids.filter(k => stateOf(k).queued), kw = kids.filter(k => !stateOf(k).queued);
    const few = ks => `${ks.slice(0, 3).map(k => T(k.id)).join(", ")}${ks.length > 3 ? ` +${ks.length - 3}` : ""}`;
    if (kw.length) todo.push(`finish ${few(kw)}`);
    if (kq.length) todo.push(`apply the Close on ${few(kq)}`);
    if (!todo.length) todo.push(s.key === "progress" ? "finish building it" : "propose it for closing");
    return N(`Nothing needed from you: waiting on an agent to ${todo.join(" and ")}.${later}`);
  }
  // ---------- whose move: the lane of each ticket ----------
  const headerParent = t => open(t) && openKids(t).length > 0;
  // {lane, sub, s, who?, y?}, or null for a parent with open children and nothing for anyone (only a family header).
  // Yours: asks whose For (else the Assignee) is the viewer, and close/keep calls on tickets assigned to the viewer.
  // The same items for someone else wait "On a teammate". With Everyone, every person's items are Yours.
  function laneInfo(t) {
    const s = stateOf(t);
    if (s.key === "done") return { lane: "done", sub: "done", s };
    const y = s.key === "needs" ? "ask" : s.staleClose ? "undo" : s.key === "covered" ? "covered" : s.key === "ready" ? (s.queued ? "closing" : "ready") : null;
    if (y) {
      const who = y === "ask" ? toAnswer(t).map(a => askFor(t, a)) : [t.assignee || ""];
      return { lane: who.some(mine) ? "yours" : "waiting", sub: who.some(mine) ? y : "teammate", s, who, y };
    }
    if (headerParent(t)) return null;
    if (s.keptFor) return { lane: "waiting", sub: "ticket", s };
    if (s.key === "parked") return { lane: "waiting", sub: "parked", s };
    if (s.key === "blocked") return { lane: "waiting", sub: s.deps || !(s.dnow || []).length ? "ticket" : "decision", s };
    if (s.key === "planning" && (s.dnow || []).length) return { lane: "waiting", sub: "decision", s };
    if (s.key === "planning" && (s.daside || []).length) return { lane: "waiting", sub: "parked", s };
    return { lane: "agent", sub: t.agent && t.agent.active ? "active" : "queue", s };
  }
  const laneOfT = t => (laneInfo(t) || {}).lane || null;
  const inBatch = t => { const s = stateOf(t); return s.key === "ready" && s.batch && !keepOpen.has(t.id) && draftOf(t.id) !== "iterate" && mine(t.assignee || ""); };

  // ---------- seen snapshots: written automatically when someone answers or makes a call ----------
  const seenOf = id => seen[id] || localSeen[id] || null;
  function changes(t) {
    const s = seenOf(t.id);
    if (!s || !s.snapshot) return null;
    if (s.fp === t.fingerprint) return [];
    const a = s.snapshot, b = t.snapshot, out = [];
    if (a.status !== b.status) out.push(`${STATUS[a.status] || a.status} → ${STATUS[b.status] || b.status}`);
    const was = new Set(a.checked || []), now = new Set(b.checked || []);
    const newly = [...now].filter(x => !was.has(x)).length, un = [...was].filter(x => !now.has(x)).length;
    if (newly) out.push(`${plural(newly, "criterion", "criteria")} checked`);
    if (un) out.push(`${plural(un, "criterion", "criteria")} unchecked`);
    if (b.criteria > a.criteria) out.push(`${plural(b.criteria - a.criteria, "criterion", "criteria")} added`);
    if (b.review !== a.review && b.review === "closure-proposed") out.push("closure proposed");
    if (b.shipped > a.shipped) out.push("what shipped updated");
    if (b.evidence > a.evidence) out.push("evidence added");
    if ((b.children_done || 0) > (a.children_done || 0)) out.push(`${plural(b.children_done - a.children_done, "child", "children")} done`);
    const wasA = new Set(a.asks || []), nowA = new Set(b.asks || []);
    const newA = [...nowA].filter(x => !wasA.has(x)).length, goneA = [...wasA].filter(x => !nowA.has(x)).length;
    if (newA) out.push(plural(newA, "new ask"));
    if (goneA) out.push(`${plural(goneA, "ask")} answered or removed`);
    if (b.log > a.log) out.push(plural(b.log - a.log, "log entry", "log entries"));
    return out.length ? out : ["small edits to the ticket text"];
  }

  // ---------- load ----------
  fetch("board-data.json").then(r => r.json()).then(d => {
    // t.id becomes the ticket's key (unique across projects: db docs, links, selection); t.label is its plain id.
    d.tickets.forEach(t => { t.label = t.id; t.id = t.key || t.id; });
    d.people = d.people || []; d.projects = d.projects || [];
    if (project && !d.projects.includes(project)) project = "";
    data = d; byId = Object.fromEntries(d.tickets.map(t => [t.id, t]));
    pickViewer();
    if (ui.selected && (byId[ui.selected] || ui.selected === "@board") && wide()) { selected = ui.selected; userPicked = true; }
    render(false);
    openHash();
  }).catch(() => { $("#queue").innerHTML = `<p class="empty">Couldn't load the ticket data. Rebuild and republish the board (/ticket-board).</p>`; });

  // ---------- identity (the same block on the decision board) ----------
  // claude.use("user") resolves null without a viewer (a local preview): then nobody is matched and the default view
  // is Everyone. Only the opaque user id is ever written to the db (as `by`), never a name or email.
  let userReady = false;
  function pickViewer() {
    if (!data) return;
    const st = store.get(VKEY, null), people = data.people || [];
    if (st && typeof st.v === "string" && (st.v === "" || people.some(p => same(p, st.v)))) viewer = st.v;
    else viewer = people.find(isMe) || "";
  }
  (async () => {
    let u = null;
    try { u = window.claude && window.claude.use ? await window.claude.use("user") : null; } catch (e) { u = null; }
    if (u) {
      try { ID.me = await u.me(); } catch (e) { ID.me = null; }
      try { ID.uid = (ID.me && ID.me.id) || (u.id ? await u.id() : null); } catch (e) { ID.uid = null; }
      try { if (typeof u.can === "function" && (await u.can("data.write")) === false) readOnly = true; } catch (e) {}
    }
    userReady = true; pickViewer(); render(false); openHash();
  })();

  (async () => {
    const c = window.claude;
    let s = null;
    try { s = c && c.use ? await c.use("db") : null; } catch (e) { s = null; }
    if (!s) { dbState = "none"; renderHead(); return; }
    db = s; dbState = "ok"; renderHead();
    db.collection("applied").onSnapshot(snap => { snap.docs.forEach(doc => { applied[doc.id] = doc.data(); }); render(); }, () => {});
    db.collection("seen").onSnapshot(snap => { snap.docs.forEach(doc => { const b = doc.data(); if (b) { seen[doc.id] = b; localSeen[doc.id] = b; } }); store.set("dotcortex-ticket-board-seen", localSeen); render(); }, () => {});
    db.collection("needs-applied").onSnapshot(snap => { snap.docs.forEach(doc => { answersApplied[doc.id] = doc.data(); }); render(); }, () => {});
    // Ticket calls (decisions/<ID>) and ask answers (needs/<TICKET>:<N>) follow the same echo and adopt rules.
    const follow = (coll, mine, resend) => { let first = true;
      db.collection(coll).onSnapshot(snap => {
        const got = new Set(), ed = editingId();
        snap.docs.forEach(doc => { const b = doc.data(); if (!b) return; const id = doc.id, m = mine[id]; got.add(id); remoteAt[id] = b.updatedAt || "";
          // Our own write coming back (or what we already hold): acknowledge it, never copy it over local text.
          if (b.updatedAt && ((m && b.updatedAt === m.updatedAt) || (sent[id] && sent[id].has(b.updatedAt)))) { if (m && b.updatedAt === m.updatedAt) ack[id] = b.updatedAt; return; }
          if (!newerThanMine(id, b)) return;              // older than what this tab has
          if (id === ed) { incoming[id] = b; return; }    // this card is being typed in: apply on blur
          adopt(id, b); });
        if (first) { first = false; Object.keys(mine).forEach(id => { const m = mine[id]; if (!m || !m.updatedAt) return;
          // resend what the db is missing or holds an older version of (e.g. typed offline, or the tab closed mid-save)
          if (got.has(id) ? remoteAt[id] < m.updatedAt : !!(m.action || m.choice)) resend(id); }); }
        store.set("dotcortex-ticket-board", local); store.set("dotcortex-ticket-board-needs", localAns); render();
      }, () => { db = null; dbState = "none"; renderHead(); }); };
    follow("decisions", local, id => change(id, {}, { rerender: false }));
    follow("needs", localAns, k => { if (askOf(k)) changeAns(k, {}, { rerender: false }); });
    Object.keys(localSeen).forEach(id => { if (!seen[id]) seenQ.push([id, localSeen[id]]); }); seenFlush();
  })();
})();
</script>
